<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignments · Masai Classes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<main>
  <h1>Assignments</h1>
  <p class="lede">Every assignment set in class, and whether I've done it. Filter to see what's left.</p>
  <div class="filters" id="filters">
    <button aria-pressed="true" data-f="all">All</button>
    <button aria-pressed="false" data-f="Not started">To do</button>
    <button aria-pressed="false" data-f="Partly">Partly done</button>
    <button aria-pressed="false" data-f="Done">Done</button>
  </div>
  <article class="md" id="doc">Loading…</article>
</main>
<script src="assets/app.js?v=1"></script>
<script>
fetch("data/assignments.md").then(r => r.text()).then(t => {
  const doc = document.getElementById("doc");
  doc.innerHTML = marked.parse(t.replace(/^# .*\n/, ""));
  const rows = [...doc.querySelectorAll("tbody tr")];
  rows.forEach(tr => {
    const s = tr.children[2];
    const k = s.textContent.trim();
    tr.dataset.s = k;
    s.innerHTML = `<span class="chip ${k === "Done" ? "done" : k === "Partly" ? "partly" : "open"}">${k}</span>`;
  });
  document.getElementById("filters").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
    rows.forEach(tr => tr.hidden = !(b.dataset.f === "all" || tr.dataset.s === b.dataset.f));
  });
}).catch(() => { document.getElementById("doc").textContent = "Could not load the tracker."; });
</script>
</body>
</html>
