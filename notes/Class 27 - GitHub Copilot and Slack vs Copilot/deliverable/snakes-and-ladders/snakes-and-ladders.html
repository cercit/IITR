<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snakes and Ladders</title>
<style>
  :root {
    --bg: #f4efe6; --card: #fffdf8; --ink: #2b2b2b; --muted: #6b6b6b;
    --a: #f3e3b8; --b: #e7f0d2; --line: #d8cfb8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0 0 12px; font-size: 1.5rem; text-align: center; }
  .wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 820px) { .wrap { grid-template-columns: minmax(0, 560px) 1fr; align-items: start; } }
  .board-box { width: 100%; max-width: 560px; margin: 0 auto; }
  .board { position: relative; width: 100%; aspect-ratio: 1; border: 3px solid #5a4a2a; border-radius: 6px; overflow: hidden; background: var(--card); }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); }
  .cell { border: 1px solid var(--line); font-size: clamp(8px, 1.7vw, 12px); padding: 2px 3px; color: var(--muted); }
  .cell.a { background: var(--a); } .cell.b { background: var(--b); }
  svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .token {
    position: absolute; width: 4.2%; height: 4.2%; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.5); transition: left .22s ease, top .22s ease;
    transform: translate(-50%, -50%);
  }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .setup { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  select, button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid #b9ad8c; background: #fff; cursor: pointer; }
  button.primary { background: #2e6b3a; color: #fff; border-color: #2e6b3a; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, select:focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
  .players { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
  .players li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 2px solid transparent; }
  .players li.turn { border-color: #2e6b3a; background: #eef7ee; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #888; flex: none; }
  .pos { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dice-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .die {
    width: 64px; height: 64px; border-radius: 12px; background: #fff; border: 2px solid #333;
    display: grid; place-items: center; font-size: 2.2rem; font-weight: 700;
  }
  .die.roll { animation: shake .12s linear infinite; }
  @keyframes shake { 0% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } 100% { transform: rotate(-8deg); } }
  #status { font-weight: 600; min-height: 1.4em; margin-bottom: 8px; }
  #log { margin: 0; padding-left: 18px; max-height: 200px; overflow-y: auto; color: var(--muted); font-size: .9rem; }
  .winner { background: #fff3c4; border: 2px solid #c9a400; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Snakes and Ladders</h1>
<div class="wrap">
  <div class="board-box">
    <div class="board" id="board" aria-label="Game board, 10 by 10 squares">
      <div class="grid" id="grid"></div>
      <svg class="overlay" id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="panel">
    <div class="setup">
      <label for="count">Players</label>
      <select id="count">
        <option value="2">2</option><option value="3">3</option><option value="4">4</option>
      </select>
      <label><input type="checkbox" id="cpu"> Computer plays Player 2</label>
      <button id="newGame">New Game</button>
    </div>

    <div id="winner" class="winner" hidden></div>
    <ul class="players" id="players"></ul>

    <div class="dice-row">
      <div class="die" id="die" aria-live="polite">&ndash;</div>
      <button class="primary" id="rollBtn">Roll (Space)</button>
    </div>
    <div id="status" role="status"></div>
    <ol id="log" reversed aria-label="Move log"></ol>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SNAKES  = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
  var LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };
  var COLORS = ['#d62828', '#1d4ed8', '#15803d', '#a21caf'];
  var NAMES = ['Red', 'Blue', 'Green', 'Purple'];
  var STEP_MS = 220;

  var state = null;       // { players:[{pos}], turn, busy, over, cpuIdx, token }
  var $ = function (id) { return document.getElementById(id); };

  // Square number (1..100) -> centre in a 0..100 box. Row 0 is the bottom row.
  function coords(n) {
    if (n < 1) return { x: -4, y: 104 };
    var idx = n - 1, row = Math.floor(idx / 10), c = idx % 10;
    var col = (row % 2 === 0) ? c : 9 - c;
    return { x: col * 10 + 5, y: (9 - row) * 10 + 5 };
  }

  function buildBoard() {
    var grid = $('grid'); grid.innerHTML = '';
    for (var r = 9; r >= 0; r--) {
      for (var c = 0; c < 10; c++) {
        var n = (r % 2 === 0) ? r * 10 + c + 1 : r * 10 + (9 - c) + 1;
        var d = document.createElement('div');
        d.className = 'cell ' + (((r + c) % 2) ? 'a' : 'b');
        d.textContent = n;
        grid.appendChild(d);
      }
    }
    var svg = $('overlay'), h = '';
    Object.keys(LADDERS).forEach(function (k) {
      var a = coords(+k), b = coords(LADDERS[k]);
      var dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len * 1.1, ny = dx / len * 1.1;
      h += '<line x1="' + (a.x + nx) + '" y1="' + (a.y + ny) + '" x2="' + (b.x + nx) + '" y2="' + (b.y + ny) + '" stroke="#8a5a1a" stroke-width="0.9"/>' +
           '<line x1="' + (a.x - nx) + '" y1="' + (a.y - ny) + '" x2="' + (b.x - nx) + '" y2="' + (b.y - ny) + '" stroke="#8a5a1a" stroke-width="0.9"/>';
      for (var i = 1; i < 6; i++) {
        var t = i / 6, px = a.x + dx * t, py = a.y + dy * t;
        h += '<line x1="' + (px + nx) + '" y1="' + (py + ny) + '" x2="' + (px - nx) + '" y2="' + (py - ny) + '" stroke="#b07a2a" stroke-width="0.7"/>';
      }
    });
    Object.keys(SNAKES).forEach(function (k) {
      var a = coords(+k), b = coords(SNAKES[k]);
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var off = Math.min(9, len / 4);
      var c1x = a.x + dx * 0.25 + (-dy / len) * off, c1y = a.y + dy * 0.25 + (dx / len) * off;
      var c2x = a.x + dx * 0.75 - (-dy / len) * off, c2y = a.y + dy * 0.75 - (dx / len) * off;
      h += '<path d="M' + a.x + ' ' + a.y + ' C' + c1x + ' ' + c1y + ',' + c2x + ' ' + c2y + ',' + b.x + ' ' + b.y +
           '" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>' +
           '<circle cx="' + a.x + '" cy="' + a.y + '" r="1.9" fill="#7b1d14"/>' +
           '<circle cx="' + b.x + '" cy="' + b.y + '" r="0.9" fill="#c0392b"/>';
    });
    svg.innerHTML = h;
  }

  function placeToken(i) {
    var p = state.players[i], el = $('tok' + i), c = coords(p.pos);
    // small offset so tokens on the same square do not fully overlap
    var ox = (i % 2 ? 1.4 : -1.4), oy = (i > 1 ? 1.4 : -1.4);
    el.style.left = (c.x + (p.pos > 0 ? ox : 0) + (p.pos < 1 ? i * 3.5 : 0)) + '%';
    el.style.top = (c.y + (p.pos > 0 ? oy : 0)) + '%';
  }

  function renderPlayers() {
    var ul = $('players'); ul.innerHTML = '';
    state.players.forEach(function (p, i) {
      var li = document.createElement('li');
      if (i === state.turn && !state.over) li.className = 'turn';
      var label = NAMES[i] + (i === state.cpuIdx ? ' (computer)' : '');
      li.innerHTML = '<span class="dot" style="background:' + COLORS[i] + '"></span><span>' + label +
                     '</span><span class="pos">' + (p.pos === 0 ? 'start' : 'square ' + p.pos) + '</span>';
      ul.appendChild(li);
    });
  }

  function log(msg) {
    var li = document.createElement('li'); li.textContent = msg;
    var l = $('log'); l.insertBefore(li, l.firstChild);
    while (l.children.length > 40) l.removeChild(l.lastChild);
  }

  function setStatus() {
    if (state.over) return;
    var name = NAMES[state.turn] + (state.turn === state.cpuIdx ? ' (computer)' : '');
    $('status').textContent = name + "'s turn";
    var humanTurn = state.turn !== state.cpuIdx;
    $('rollBtn').disabled = state.busy || !humanTurn;
  }

  function newGame() {
    var count = +$('count').value;
    var cpuIdx = $('cpu').checked ? 1 : -1;
    var prevToken = state ? state.token : 0;
    state = { players: [], turn: 0, busy: false, over: false, cpuIdx: cpuIdx, token: prevToken + 1 };
    for (var i = 0; i < count; i++) state.players.push({ pos: 0 });

    var board = $('board');
    Array.prototype.slice.call(board.querySelectorAll('.token')).forEach(function (t) { t.remove(); });
    for (var j = 0; j < count; j++) {
      var t = document.createElement('div');
      t.className = 'token'; t.id = 'tok' + j; t.style.background = COLORS[j];
      board.appendChild(t); placeToken(j);
    }
    $('winner').hidden = true;
    $('die').textContent = '–'; $('die').classList.remove('roll');
    $('log').innerHTML = '';
    renderPlayers(); setStatus();
    maybeCpu();
  }

  function sleep(ms, token) {
    return new Promise(function (res) {
      setTimeout(function () { res(token === state.token); }, ms);
    });
  }

  // Pure rule: where does a roll from `pos` land? Returns {to, note}.
  function applyRoll(pos, roll) {
    var t = pos + roll;
    if (t > 100) return { to: pos, note: 'needs an exact roll to reach 100', stay: true };
    return { to: t };
  }

  async function takeTurn(roll) {
    var tk = state.token, i = state.turn, p = state.players[i];
    state.busy = true; setStatus();
    var die = $('die'); die.classList.add('roll');
    await sleep(500, tk).then(function (ok) { if (!ok) throw 0; });
    die.classList.remove('roll'); die.textContent = roll;

    var name = NAMES[i], r = applyRoll(p.pos, roll);
    if (r.stay) {
      log(name + ' rolled ' + roll + ' and ' + r.note + '.');
    } else {
      for (var s = p.pos + 1; s <= r.to; s++) {
        p.pos = s; placeToken(i); renderPlayers();
        await sleep(STEP_MS, tk).then(function (ok) { if (!ok) throw 0; });
      }
      var msg = name + ' rolled ' + roll + ' to square ' + p.pos;
      if (LADDERS[p.pos]) {
        msg += ', climbed a ladder to ' + LADDERS[p.pos];
        log(msg + '.');
        p.pos = LADDERS[p.pos]; placeToken(i); renderPlayers();
        await sleep(450, tk).then(function (ok) { if (!ok) throw 0; });
      } else if (SNAKES[p.pos]) {
        msg += ', slid down a snake to ' + SNAKES[p.pos];
        log(msg + '.');
        p.pos = SNAKES[p.pos]; placeToken(i); renderPlayers();
        await sleep(450, tk).then(function (ok) { if (!ok) throw 0; });
      } else {
        log(msg + '.');
      }
    }

    if (p.pos === 100) {
      state.over = true; state.busy = false;
      var w = $('winner'); w.hidden = false;
      w.textContent = name + (i === state.cpuIdx ? ' (computer)' : '') + ' wins!';
      $('status').textContent = 'Game over. Press New Game to play again.';
      $('rollBtn').disabled = true; renderPlayers();
      return;
    }
    if (roll !== 6) state.turn = (state.turn + 1) % state.players.length;
    else log(name + ' rolled a 6 and plays again.');
    state.busy = false; renderPlayers(); setStatus();
    maybeCpu();
  }

  function doRoll() {
    if (!state || state.busy || state.over || state.turn === state.cpuIdx) return;
    go();
  }

  function go() {
    var roll = Math.floor(Math.random() * 6) + 1;
    takeTurn(roll).catch(function (e) { if (e !== 0) throw e; });
  }

  function maybeCpu() {
    if (state.over || state.turn !== state.cpuIdx) return;
    var tk = state.token;
    state.busy = true; setStatus();
    setTimeout(function () {
      if (tk !== state.token || state.over) return;
      state.busy = false; go();
    }, 700);
  }

  $('rollBtn').addEventListener('click', doRoll);
  $('newGame').addEventListener('click', newGame);
  $('count').addEventListener('change', newGame);
  $('cpu').addEventListener('change', newGame);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'INPUT') {
      e.preventDefault(); doRoll();
    }
  });

  buildBoard();
  newGame();

  // Exposed only so tests can check the board data and rule helpers.
  window.__sl = { SNAKES: SNAKES, LADDERS: LADDERS, coords: coords, applyRoll: applyRoll };
})();
</script>
</body>
</html>
